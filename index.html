<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semantic Tag HTML</title>
  </head>
  <body>
    <table border="1" align="center" cellpadding="100">
      <tbody align="center">
        <tr>
          <td colspan="2"><font color="green">&lt;header&gt;</font></td>
        </tr>
        <tr>
          <td colspan="2"><font color="blue">&lt;nav&gt;</font></td>
        </tr>
        <tr>
          <td><font color="purple">&lt;section&gt;</font></td>
          <td rowspan="2"><font color="yellow">&lt;aside&gt;</font></td>
        </tr>
        <tr>
          <td><font color="orange">&lt;article&gt;</font></td>
        </tr>
        <tr>
          <td colspan="2"><font color="red">&lt;footer&gt;</font></td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
